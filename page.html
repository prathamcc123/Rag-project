0/wheatorganic.jpg"/><meta name="twitter:card" content="summary_large_image"/><meta name="twitter:title" content="गेहूं की जैविक खेती से संबंधित कृषि क्रियाएं"/><meta name="twitter:description" content="इस पृष्ठ में गेहूं की जैविक खेती से संबंधित कृषि क्रियाओं की जानकारी दी गयी है I"/><meta name="twitter:image" content="https://static.vikaspedia.in/media/images_hi/agriculture/crop-production/91c94893593f915-916947924940/wheatorganic.jpg"/><meta name="twitter:site" content="@vikaspedia"/><script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"कृषि","item":"http://agriculture.vikaspedia.in/viewcontent/agriculture?lgn=hi"},{"@type":"ListItem","position":2,"name":"फसल उत्पादन","item":"http://agriculture.vikaspedia.in/viewcontent/agriculture/crop-production?lgn=hi"},{"@type":"ListItem","position":3,"name":"जैविक खेती ","item":"http://agriculture.vikaspedia.in/viewcontent/agriculture/crop-production/91c94893593f915-916947924940?lgn=hi"},{"@type":"ListItem","position":4,"name":"गेहूं की जैविक खेती से संबंधित कृषि क्रियाएं","item":"http://agriculture.vikaspedia.in/viewcontent/agriculture/crop-production/91c94893593f915-916947924940/गेहूं-की-जैविक-खेती-से-संबंधित-कृषि-क्रियाएं-null-1?lgn=hi"}]}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","mainEntityOfPage":{"@type":"WebPage","@id":"https://agriculture.vikaspedia.in/viewcontent/agriculture/crop-production/91c94893593f915-916947924940/गेहूं-की-जैविक-खेती-से-संबंधित-कृषि-क्रियाएं-null-1?lgn=hi"},"headline":"गेहूं की जैविक खेती से संबंधित कृषि क्रियाएं","description":"इस पृष्ठ में गेहूं की जैविक खेती से संबंधित कृषि क्रियाओं की जानकारी दी गयी है I","image":"https://static.vikaspedia.in/media/images_hi/agriculture/crop-production/91c94893593f915-916947924940/wheatorganic.jpg","author":{"@type":"Person","name":"Mary Pushpa Kujur"},"keywords":["बीज दर और अंतराल","अतिरिक्त फसल प्रणाली","भूमि का चयन और तैयार करना","फसल की सुरक्षा","बिजाई का समय","आकस्मिक प्रणाली","बीज का उपचार","अनुमोदित किस्में","सस्य विधियां और खरपतवार प्रबंधन","मृदा उर्वरकता प्रबंधन","सिंचाई और पानी","रोग प्रबंधन","उपज"," wheat","organic farming"],"articleBody":"<div id=\"MiddleColumn_internal\">\n<h3 style=\"text-align: justify;\">भूमि का चयन और तैयार करना</h3>\n<p>गेहूं की खेती विभिन्न प्रकार की भूमि में की जा सकती है। इसके लिए 6.5-7.8 पीएच रेंज और 1 प्रतिशत से अधिक जैविक<img class=\"image-right\" style=\"float: right;\" src=\"https://static.vikaspedia.in/media/images_hi/agriculture/crop-production/91c94893593f915-916947924940/wheatorganic.jpg\" width=\"435\" height=\"266\" />कार्बन युक्त सुनिकासी व्यवस्था वाली मध्यम दोमट और चिकनी दोमट मृदा उपयुक्त होती है। खेत में पीएच स्तर, जैविक कार्बन, सूक्ष्म पोषक तत्वों (एनपी.के.) और सूक्ष्मजीवों की संख्या की जांच करने के लिए वर्ष में एक बार मृदा की जांच करने की अपेक्षा होती है। यदि जैविक कार्बन का मात्रा 1 प्रतिशत से कम हो तो, 25-30 टन/हैक्टेयर कार्बनिक खाद का प्रयोग करें और खाद को भली भांति मिलाने के लिए खेत की 2-3 बार अच्छी तरह जुताई करें। प्रमाणि जैविक खेतों पर प्रतिबंधित सामग्रियों के प्रवाह को रोकने के लिए प्रमाणित जैविक खेतों और अजैविक खेतों के बीच लगभग 5-7 मीटर की दूरी पर पर्याप्त सुरक्षा पट्टी का प्रबन्ध किया जाए। गेहूं की खेती के लिए भली भांति सूक्ष्म जुताई किंतू छोटी बीज क्यारियां अपेक्षित होती हैं। खरीफ की कटाई के बाद, भूमि की जुताई की जाती है और पाटा अथवा किसी अन्य उपयुक्त जुताई यन्त्र द्वारा मिट्टी के बड़े पिण्डों को तोड़कर एकसमान सिंचाई के लिए खेत को भली भांति समतल बनाया जाता है। हल्के ढाल होने की स्थिति में, परिरेखा खेती विधि का आश्रय लेना चाहिए। हिमाचल प्रदेश में गेहूं की औसतन उपज 15.33 क्विंटल/हैक्टेयर है, जबकि राष्ट्रीय औसत 28. 02 क्विंटल/हैक्टेयर है। गेहूं की कम पैदावार के मुख्य कारण इसकी खेती 83 प्रतिशत बारानी भूमि पर की जा रही है, सुधरी किस्मों की कम भूमि पर खेती, खादों का कम प्रयोग, खरपतवार एवं कीट व बीमारियों का प्रकोप इत्यादि गेहूं की कम उपज का कारण है।</p>\n<h3 style=\"text-align: justify;\">बिजाई का समय</h3>\n<p style=\"text-align: justify;\">अच्छी पैदावार लेने के लिए गेहूं की बिजाई सही समय पर करनी चाहिए। प्रदेश के विभिन्न क्षेत्रों में बिजाई का समय निम्नलिखित है &ndash;</p>\n<table class=\"grid listing\" style=\"text-align: justify;\">\n<tbody>\n<tr>\n<td>\n<p>क्षेत्र</p>\n<p>&nbsp;</p>\n</td>\n<td>\n<p>सिंचित</p>\n<p>&nbsp;</p>\n</td>\n<td>\n<p>असिंचित</p>\n</td>\n</tr>\n<tr>\n<td colspan=\"3\">\n<p><strong>समय से बिजाई </strong></p>\n</td>\n</tr>\n<tr>\n<td>\n<p>निचले पर्वतीय क्षेत्र</p>\n</td>\n<td>\n<p>अक्तूबर के अंतिम सप्ताह - 15 नवम्बर</p>\n<p>&nbsp;</p>\n</td>\n<td>\n<p>अक्तूबर के अंतिम सप्ताह15 नवम्बर</p>\n</td>\n</tr>\n<tr>\n<td>\n<p>मध्यवर्ती पर्वतीय क्षेत्र</p>\n</td>\n<td>\n<p>- यथोपरि -</p>\n<p>&nbsp;</p>\n</td>\n<td>\n<p>- यथोपरि -</p>\n<p>&nbsp;</p>\n</td>\n</tr>\n<tr>\n<td>\n<p>ऊंचे पर्वतीय क्षेत्र</p>\n<p>&nbsp;</p>\n</td>\n<td>\n<p>1 अक्तूबर से 15 अक्तूबर</p>\n</td>\n<td>\n<p>1 अक्तूबर से 15 अक्तूबर</p>\n</td>\n</tr>\n<tr>\n<td colspan=\"3\">\n<p>पछेती बिजाई</p>\n</td>\n</tr>\n<tr>\n<td>\n<p>निचले पर्वतीय क्षेत्र</p>\n</td>\n<td>\n<p>दिसम्बर के अन्त तक</p>\n<p>&nbsp;</p>\n</td>\n<td>\n<p>वर्षा पर निर्धारित परंतु दिसंबर के अंत तक</p>\n</td>\n</tr>\n<tr>\n<td>\n<p>मध्यवर्ती पर्वतीय क्षेत्र</p>\n</td>\n<td>\n<p>- यथोपरि-</p>\n</td>\n<td>\n<p>- यथोपरि -</p>\n</td>\n</tr>\n<tr>\n<td>\n<p>ऊंचे पर्वतीय क्षेत्र</p>\n</td>\n<td>\n<p>15 अक्तूबर तक</p>\n</td>\n<td>\n<p>15 अक्तूबर तक</p>\n</td>\n</tr>\n</tbody>\n</table>\n<p style=\"text-align: justify;\">&nbsp;</p>\n<p style=\"text-align: justify;\">यदि देरी से बिजाई की जाये तो उत्पादन में कमी आ जाती है।</p>\n<h3 style=\"text-align: justify;\">आकस्मिक प्रणाली</h3>\n<p style=\"text-align: justify;\">यदि कुल्लू घाटी (खण्ड -2) में सर्दियों की बारिश आने में बहुत देरी हो जाये तो गेहूं (VL-892) और गोभी- सरसों (किस्म शीतल) की बिजाई सबसे लाभदायक रहती है। उसके बाद गेहूं (HS-490) की बिजाई जनवरी के पहले पखवाड़े तक कर लेनी चाहिए</p>\n<p style=\"text-align: justify;\">और ऐसी स्थिति में बारानी खेती के लिए दी गई नाईट्रोजन की मात्रा की 25 प्रतिशत अधिक मात्रा इन फसलों को देनी चाहिए। ऐसी परिस्थितियों में मसर (किस्म विपाशा), सरसों (किस्म बी.एस.एच.-1) या राया (किस्म वरूणा) को क्रमशः लगाना चाहिए।</p>\n<h3 style=\"text-align: justify;\">अनुमोदित किस्में</h3>\n<table class=\"grid listing\" style=\"text-align: justify;\">\n<tbody>\n<tr>\n<td>\n<p>बिजाई</p>\n</td>\n<td>\n<p>बिजाई का समय</p>\n<p>&nbsp;</p>\n</td>\n<td>\n<p>अनुमोदित किस्में</p>\n</td>\n</tr>\n<tr>\n<td>\n<p>अगेती</p>\n</td>\n<td>\n<p>अक्तूबर 15 तक</p>\n<p>&nbsp;</p>\n</td>\n<td>\n<p>वी.एल.- 829</p>\n</td>\n</tr>\n<tr>\n<td>\n<p>समय पर</p>\n<p>&nbsp;</p>\n</td>\n<td>\n<p>अक्तूबर तीसरे सप्ताह से 15 नवम्बर तक</p>\n</td>\n<td>\n<p>एच.पी.डब्ल्यू.-147</p>\n<p>एच.पी.डब्ल्यू.-155</p>\n<p>एच.पी.डब्ल्यू.- 249</p>\n</td>\n</tr>\n<tr>\n<td>\n<p>पछेती</p>\n</td>\n<td>\n<p>दिसम्बर अंत तक</p>\n<p>&nbsp;</p>\n</td>\n<td>\n<p>एच.पी.डब्ल्यू.- 42</p>\n<p>वी.एल.- 892</p>\n</td>\n</tr>\n</tbody>\n</table>\n<p style=\"text-align: justify;\">&nbsp;</p>\n<h3 style=\"text-align: justify;\">बीज का उपचार</h3>\n<p style=\"text-align: justify;\">बीज के उपचार से पूर्व, सुनिश्चित कर लें कि बीज स्वस्थ, आकार में एकसमान और किसी किस्म की कीट क्षति अथवा रोग से मुक्त हों। बीजों को प्रत्येक 10 कि.ग्रा. बीज के लिए पहले बीजामृत और ट्रिकोडर्मा विरदी से क्रमशः 1.5 कि.ग्रा. और 80 ग्राम की दर से संसाधित किया जाता है। फिर से 10 कि.ग्रा. बीजों के लिए प्रत्येक 200 ग्राम एजोटोबैक्टर और पीएसबी जैव उर्वरक के मिश्रण से बीजों को संसाधित करें। बीजों को छाया में सुखाएं और संसाधित करने के 6-8 घण्टे में बुआई करें।</p>\n<h3 style=\"text-align: justify;\">बीज दर और अंतराल</h3>\n<p style=\"text-align: justify;\">किसान प्रायः छट्टा देकर बीज बोते हैं परंतु इसमें निराई, गुड़ाई में कठिनाई आती है। और पैदावार भ्ज्ञी कम होती है। इसलिए गेहू को 22 सें.मी. कतारों में बोया जाना चाहिए। सही समय की बिजाई के लिए 90-110 किलोग्राम बीज प्रति हैक्टेयर पर्याप्त होता है। लेकिन बारानी क्षेत्रों में 20 दिसम्बर के बाद बिजाई के लिए 150 किलोग्राम बीज प्रति हैक्टेयर उपयुक्त होता है। बीजों की बुआई 5-7.5 सें.मी. की गहराई पर, अभिमानतः ड्रिलिंग द्वारा अथवा हल के पीछे से की जाती है। सिंचाई की स्थितियों और बुआई के समय के आधार पर बीज की मात्रा और अंतराल भिन्न होता है जो निम्नानुसार है &ndash;</p>\n<p style=\"text-align: justify;\">वर्षापोषित - अक्तूबर के मध्य से अक्तूबर के अंत तक बुआई, 75-90 कि.ग्रा./है0</p>\n<p style=\"text-align: justify;\">सिंचित-15 नवम्बर से 05 दिसम्बर के दौरान बुआई, 90 कि.ग्रा./है0|</p>\n<p style=\"text-align: justify;\">विलम्बित सिंचित-5 दिसम्बर से दिसंबर के अंत तक की अवधि के दौरान बुआई, 130-150 कि.ग्रा./है0</p>\n<p style=\"text-align: justify;\">वर्षापोषित और सिंचित स्थितियों में पंक्ति दर पंक्ति दूरी 22.5 सें.मी. बनाए रखनी चाहिए। विलंबित बुआई के मामले में, पंक्ति दर पंक्ति से 15-18 सें.मी. तक कम कर देनी चाहिए। वर्षापोषित स्थितियों में कुछ किसान केवल 50-75 कि.ग्रा. गेहूं के बीजों की बुआई छितराकर करते हैं। पौधों की कम संख्या और आंतर अंतराल में बढ़ौतरी से टिलरस अधिक संख्या में होते हैं और उत्पादकता भी अधिक होती है। जैव विविधता बनाए रखने के लिए, बुआई के समय गेहूं के बीजों के साथ 3 कि.ग्रा. मसर | और 500 ग्राम सरसों के बीज मिलाए जा सकते हैं। गेहूं की प्रत्येक 8-12 पंक्तियों के बाद उभार लिए मेंढों पर एक पंक्ति राजमाह की बुआई की जा सकती है और गेहूं की प्रत्येक पंक्ति में कहीं-कहीं सरसों की बुआई की जा सकती है।</p>\n<h3 style=\"text-align: justify;\">मृदा उर्वरकता प्रबंधन</h3>\n<p style=\"text-align: justify;\">जैविक खेती में रासायनिक खादों का प्रयोग नहीं किया जाता। अतः 15 टन देसी खाद + 2 टन बी.डी. कम्पोस्टर प्रति हैक्टेयर या केंचुआ खाद 10 टन + बी.डी. कम्पोस्ट 2 टन प्रति हैक्टेयर उपयुक्त होती है। गेहूं से पूर्व फसल (खरीफ में) प्रति एकड़ को पर्याप्त उर्वरक (1-2 टन कपोस्ट), 100 कि.ग्रा. रॉक - फॉस्फेट और 2 कि.ग्रा. पीएसबी दिया जाना चाहिए। खरीफ की फसल के बाद, फसल के अवशेषों को एकत्र कर ढेर के रूप में मेढ़ों पर रख दें। अवशेष के ढेर को गाय के गोबर - गौमूत्र के घोल (50 लीटर/टन) और ट्रिकोडर्मा विरदी (1 कि.ग्रा. प्रति टन) सस्य से भिगो दें। बुआई के समय 2.0 कि.ग्रा. पीएसबी के साथ 8-10 क्विंटल एफवाईएम/कपोस्ट अथवा 5-10 कि.ग्रा. चूना भी मिलाया जाना चाहिए। 200-300 कि.ग्रा. सांद्रित उर्वरक (शुष्क मुर्गी उर्वरक और खली का चूरा 1:1 अथवा कोई अन्य किस्म) और ड्रिलिंग से 150-200 कि.ग्रा. नीम/पोंगम/अरंडी/मूंगफली केक से उत्पादकता में बढ़ौतरी होगी। फॉस्फोरस की उपलब्धता में बढ़ौतरी के लिए अंडे के छिलके का उर्वरक अथवा बायोडाइनेमिक्स कपोस्ट भी प्रयोग किया जा सकता है। सूक्ष्मजीवों की शीघ्र बढ़ौतरी और विभिन्न पोषक तत्वों के शीघ्र मोचन के लिए संजीवक अथवा अमृतपानी अथवा जीवामृत का समय पर प्रयोग आवश्यक है। इन तीनों में से, जीवामृत सबसे अधिक प्रभावी है। बुआई के बाद पहली चार सिंचाईयों के दौरान यथा: 21, 42, 60 और 75 दिनों के बाद 500 लीटर जीवमृत प्रति हैक्टेयर प्रयोग की जाती है। फसल की उचित वृद्धि के लिए 20 दिनों के बाद 7-10 दिनों के अंतराल पर दानों के निर्माण की अवस्था तक पत्ते पर छिड़काव के तौर पर वर्मीवश और गौमूत्र का प्रयोग किया जाए। एक एकड़ क्षेत्र में छिड़काव के लिए लगभग 200 लीटर पानी में 20 लीटर गौमूत्र मिलाएं। पानी की उपलब्धता के आधार पर गेहूं की अच्छी उपज लेने के लिए निम्नलिखित सिंचाई की व्यवस्था करनी चाहिए।</p>\n<h3 style=\"text-align: justify;\">सिंचाई और पानी</h3>\n<table class=\"vertical listing\" style=\"text-align: justify;\">\n<tbody>\n<tr>\n<td colspan=\"3\">\n<p>गेहूं की फसल में जो संभव सिंचाईयां दी जा सकें</p>\n</td>\n<td colspan=\"3\">\n<p>फसल की बढ़ौतरी की विभिन्न अवस्थाएं जब सिंचाई देनी चाहिए।</p>\n</td>\n</tr>\n<tr>\n<td>\n<p>सिंचाई</p>\n</td>\n<td>\n<p>मूसल जड़े निकलने पर</p>\n</td>\n<td>\n<p>दौजियां निकलने की अंतिम अवस्था पर</p>\n</td>\n<td>\n<p>गांठ बनने अंतिम की अवस्था पर</p>\n<p>&nbsp;</p>\n</td>\n<td>\n<p>फूल आने की अंतिम अवस्था पर</p>\n</td>\n<td>\n<p>दानों में दूध पड़ने पर</p>\n<p>&nbsp;</p>\n</td>\n</tr>\n<tr>\n<td>\n<p>एक</p>\n<p>दो</p>\n<p>तीन</p>\n<p>चार</p>\n<p>पांच</p>\n</td>\n<td>\n<p>सिंचाई दें</p>\n<p>सिंचाई दें</p>\n<p>सिंचाई दें</p>\n<p>सिंचाई दें</p>\n<p>सिंचाई दें</p>\n</td>\n<td>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>सिंचाई दें</p>\n<p>सिंचाई दें</p>\n</td>\n<td>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>सिंचाई दें</p>\n<p>सिंचाई दें</p>\n<p>सिंचाई दें</p>\n</td>\n<td>\n<p>&nbsp;</p>\n<p>सिंचाई दें</p>\n<p>सिंचाई दें</p>\n<p>सिंचाई दें</p>\n<p>सिंचाई दें</p>\n</td>\n<td>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>सिंचाई दें</p>\n</td>\n</tr>\n</tbody>\n</table>\n<p style=\"text-align: justify;\">&nbsp;</p>\n<p style=\"text-align: justify;\">यदि सिंचाई की और व्यवस्था हो, तो बिजाई से पहले सिंचाई करनी चाहिए या बिजाई के 30-40 दिनों के बाद सिंचाई देनी चाहिए।</p>\n<h3 style=\"text-align: justify;\">सस्य विधियां और खरपतवार प्रबंधन</h3>\n<p style=\"text-align: justify;\">मल्चिंग और सतह प्रबंधन- बुआई से 24 - 48 घंटों के बाद ढाल के अनुसार खेतों को छोटी मेंढे बनाकर छोटी क्यारियों में विभाजित कर दें। मल्च का कार्य करने के लिए खरीफ की फसल के आंशिक तौर पर विघटित फसल अवशेष (मेंद्रों पर पड़े हुए) को पूरे खेत पर फैला दें।</p>\n<p style=\"text-align: justify;\">निराई- सिंचित दशा में, न्यूनतम 3 बार निराई आवश्यक है, प्रथम 20-25 दिनों, द्वितीय 40-45 दिनों और तृतीय 60-65 दिनों के अंतराल पर। वर्षापोषित परिस्थितियों में दो बार निराई जरूरी होती है। जैविक प्रबंधन के तहत हाथ से निराई सबसे अधिक प्राथमिकता वाली विधि है।</p>\n<h3 style=\"text-align: justify;\">अतिरिक्त फसल प्रणाली</h3>\n<p style=\"text-align: justify;\">गेहूं को प्रायः मक्की/धान की फसल प्रणाली के साथ लगाया जाता है। परंतु सिंचित अवस्थाओं में धान-मूली-आलू, मक्की-मूली-प्याज, मक्की-तोरिया-आलू और मक्की-तोरिया + गोभी सरसों फसल चक्र अधिक आय देने वाले हैं। असिंचित अवस्थाओं में मक्की-तोरिया + गोभी सरसों, मक्की-चना और मक्की+रौंगी-गेहूं फसल प्रणालियां, मक्की-गेहूं फसल चक्र से अधिक लाभदायक हैं। खंड-1 के असिंचित क्षेत्रों में अरहर (सरिता) - गेहूं (वी.एल.- 892/एनएस.-490) फसल चक्र मक्की -गेहूं फसल चक्र अधिक लाभदायक है।</p>\n<h3 style=\"text-align: justify;\">फसल की सुरक्षा</h3>\n<p style=\"text-align: justify;\">कीट प्रबंधन</p>\n<table class=\"grid listing\" style=\"text-align: justify;\">\n<tbody>\n<tr>\n<td>\n<p>दीमक व टीडे मकौड़े</p>\n</td>\n<td>\n<p>दीमक फसल की वृद्धि की किसी भी अवस्था में फसल को क्षति पहुंचा सकती है। यह समस्या सिंचित क्षेत्रों की अपेक्षा वर्षापोषित क्षेत्रों में अधिक प्रमुख है। गैर - सिंचित दशाओं में अविघटित कार्बनिक खाद के प्रयोग से भी दीमक के प्रकोप की संभावना बढ़ सकती है। बुआई के समय मृदा में नीम के पत्ते की खाद (5 क्विंटल/है0) अथवा नीम खाद (1 क्विंटल/है0) के प्रयोग से दीमक के आक्रमण से बचा जा सकता है। चूना और गंधक का मिश्रण जमीन में डालने से दीमक के प्रकोप में कमी आती है। लकड़ी की राख को पौधों के तनों के मूल में डालने से भी दीमक के प्रकोप में कमी आती है। पशु - मूत्र को पानी में 1:6 में मिलाकर बार - बार दीमक के घरों में डालने से उनके प्रसार को रोका जा सकता है। वीवेरिया या मेटाराईजियम फफूद का कण अवस्था में (6 ग्राम प्रति वर्ग मीटर) प्रयोग करें।</p>\n<p>&nbsp;</p>\n</td>\n</tr>\n<tr>\n<td>\n<p>आर्मी वॉर्मस</p>\n<p>&nbsp;</p>\n</td>\n<td>\n<p>इस कीट की इल्ली पौधे विशेषकर उसके नाजुक अंगों को रात्रि के दौरान खाती है और दिन के समय छिपी रहती है। वे पत्तों और बालियों को भी क्षति पहुंचाती है। नीम के पत्तों के सत्व (उबले हुए पानी में 5 कि.ग्रा. टुकड़े-टुकड़े नीम के पत्ते और 100 लीटर पानी में विघटित) से इसके आक्रमण को प्रभावी तौर पर कम किया जा सकता है। संडियों को इकट्ठा करके नष्ट कर दें। एन.पी.वी., वी.टी. का प्रयोग करें। या दशपर्णी का 10 प्रतिशत घोल का प्रयोग करें।</p>\n</td>\n</tr>\n<tr>\n<td>\n<p>बाउन व्हीट इल्ली, एफिड्स और जैस्सिड्स</p>\n</td>\n<td>\n<p>गेहूं के साथ सरसों और कुसुम (बुआई के समय प्रत्येक 100 कि.ग्रा. गेहूं के साथ मिश्रित 100 ग्राम बीज) का आंतर फसल से भी कुटकी के फैलाव को प्रभावी तौर पर नियंत्रित किया जा सकता है। गंभीर आक्रमण की स्थिति में, 3-5 दिन तक 100 लीटर पानी में 15 लीटर गौमूत्र, 2 कि.ग्रा. गाय के गोबर और 15 कि.ग्रा. टुकड़े-टुकड़े किए नीम के पत्तों का प्रयोग करें। खमीर को छानें और एक एकड़ में पत्तों पर छिड़काव के लिए प्रयोग करें। यह पालतू जानवरों के प्राकृतिक शत्रुओं जैसे सुररखी आदि के लिए सुरक्षित है।</p>\n</td>\n</tr>\n</tbody>\n</table>\n<h3 style=\"text-align: justify;\">रोग प्रबंधन</h3>\n<table class=\"grid listing\" style=\"text-align: justify;\">\n<tbody>\n<tr>\n<td>\n<p>रतुआ</p>\n<p>&nbsp;</p>\n</td>\n<td>\n<p>रतुआ फफूदी, रोग की तीन भिन्न प्रजातियों की वजह से होता है। भूरा और पीला रतुआ उत्तरी - पश्चिमी भाषा में विशेष महत्व रखते हैं। इन क्षेत्रों में काला रतुआ काफी विलम्ब से दिखाई देता है और सामान्यतः काफी विलंब से बुआई वाले खेतों को छोड़ अधिक क्षति नहीं पहुंचाते। तथापि, मध्य और पूर्वी भारत में काला रतुआ भयंकर रूप में प्रकट होता है और काफी अधिक नुकसान पहुंचाता है। रतुओं को नियंत्रित करने हेतु सर्वाधिक प्रभावी विधि रतुआ - प्रतिरोधी किस्में उगाना है। गेहूं की किस्मों के बीच जैव विविधता से भी रतुआ की समस्या को प्रभावी तौर पर नियंत्रित किया जा सकता है। प्रत्येक फार्म पर एक समय में गेहूं की 3-4 किस्मों का प्रयोग करें। विलम्ब से बुआई अथवा देरी से परिपक्व होने वाली किस्मों से बचा जाए। फसल को रतुआ के संक्रमण से बचाने के लिए 200 लीटर पानी के सज्ञथ 5 लीटर खट्टी छाछ का छिड़काव करें। रतुआ के संक्रमण से बचने के लिए (चौलाई अथवा लाल भाजी - एक आम हरी पत्तेदार सब्जी) अथवा मैंथा (पुदीना) के पत्तों के चूर्ण को भी महीन छिड़काव (प्रति लीटर पानी 25-30 ग्राम सूखे पत्तों का पाउडर) के तौर पर प्रयोग किया जा सकता है। रतुआ संक्रमण रोकने के लिए हिबिस्कस रोसा-चानेन्सीस (चीनी गुलाब) के सूखे पत्तों का सार भी पत्तों पर छिड़काव के तौर पर प्रयोग किया जा सकता है।</p>\n</td>\n</tr>\n<tr>\n<td>\n<p>खुला काला चुर्णिल रोग</p>\n<p>&nbsp;</p>\n</td>\n<td>\n<p>सभी किस्मों में बाहरी लक्षण रोगग्रस्त पौधे की लगभग प्रत्येक बाल में गेहूं के दानों खाद्यान्न के स्थान पर काले चूर्ण का बनना है। जैविक खेती के तहत प्रतिरोधी किस्मों का प्रयोग सर्वश्रेष्ठ विकल्प है। इसके अतिरिक्त, चूंकि यह रोग बीजजन्य है, रोगमुक्त बीज के प्रयोग से इसे होने से रोका जा सकता है। शंका की स्थिति में, बीज को 5 प्रतिशत वर्मीवाश से संसाधिक करें। संक्रमित पौधों को उखाड़ दें और उनके बीजाणुओं के छितरने से पहले उन्हें जला दें। झुलसाने वाली गर्मी वाले क्षेत्रों में बीजों के धूप के ताप में संसाधन से भी इसके रोगवाहक को काफी हद तक समाप्त किया जा सकता है।</p>\n<p>&nbsp;</p>\n</td>\n</tr>\n<tr>\n<td>\n<p>बंटुआ</p>\n<p>&nbsp;</p>\n</td>\n<td>\n<p>उत्तरी भारत में गेहूं की सभी व्यावसायिक किस्मों में करनाल बंटुआ की समस्या आम है। किन्तु यह रोग पारंपरिक किस्मों में काफी दुर्लभ है। इस रोग से गेहूं के गुणवत्ता और परिमाण, दोनों में कमी आती है। खाद्यान्न का एक अंश, इसकी लीक के साथ-साथ काले चूर्ण सामग्री में परिवर्तित हो जाता है, जिसमें से बदबू आती है। प्रतिरोधी किस्में उगाना विकल्प है। रोगमुक्त बीजों का प्रयोग करें। बीजों को 5 प्रतिशत वर्मीवॉश से पूर्व संसाधित करें। 100 लीटर जल में 1 कि.ग्रा. सरसों के आटे और 5 लीटर दूध के मिश्रण का पत्तों पर छिड़काव के तौर पर प्रतिशत नमी की संस्तुति की जाती है। प्राकृतिक अथवा यांत्रिक स्रोतों से इसे सूखाया जाता है। 30 से 40 डिग्री से0 तापमान पर 13 प्रतिशत से अधिक नमी होने पर गेहूं में फफूदी लग सकती है जिसके कारण इसमें फफूदीदार दुर्गंध, बदरंगपन और निम्न आटा का उत्पादन होता है। गेहूं के लिए संतुलित नमी मात्रा 70 प्रतिशत सापेक्षिक आर्द्रता पर 13.5 प्रतिशत है। अल्पकाल के लिए, भण्डारण में 13 से 14 प्रतिशत नमी की मात्रा सह्य है जबकि 5 वर्ष तक की लंबी अवधि तक के लिए यह 11 से 12 प्रतिशत होनी चाहिए। इसे भृग से बचाने के लिए 0.5 प्रतिशत का तेज काली मिर्च पाउडर मिश्रित करें। गाय का गोबर अथवा 2 प्रतिशत नीम पाउडर भंडारित गेहूं को सूंडी और अन्य पीड़कों से बचाते हैं।</p>\n</td>\n</tr>\n</tbody>\n</table>\n<h3 style=\"text-align: justify;\">उपज</h3>\n<p style=\"text-align: justify;\">जैविक तौर पर उगाए गेहूं की औसत उत्पादकता 40-50 क्विंटल/है0 के बीच होती हैं।</p>\nस्रोत: <a class=\"external_link ext-link-icon external-link\" title=\" इंटरनेशनल कॉम्पीटेंस सेंटर फॉर आर्गेनिक एग्रीकल्चर  (नए विंडोज में खुलने वाली अन्य वेबसाइट लिंक)\" href=\"http://www.iccoa.org/\" target=\"_blank\" rel=\"noopener\"> इंटरनेशनल कॉम्पीटेंस सेंटर फॉर आर्गेनिक एग्रीकल्चर </a></div>","contributor":{"@type":"Person","name":"Mary Pushpa Kujur"},"publisher":{"@type":"GovernmentOrganization","name":"CDAC-Hyderabad","url":"https://www.cdac.in/","logo":{"@type":"ImageObject","url":"https://www.cdac.in/img/cdac-logo.png"}},"datePublished":"2018-05-04T13:49:49.000+00:00","dateModified":"2020-04-14T22:27:29.000+00:00","inLanguage":"hi","isPartOf":{"@type":"WebSite","name":"Vikaspedia - Agriculture","url":"https://vikaspedia.in"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"गेहूं की जैविक खेती से संबंधित कृषि क्रिया 3e93093f924-91594393793f-93893293e939/92e93e93993593e930-91594393793f-91593e93094d92f/दिसंबर-माह-के-कृषि-कार्य/गेहूं-एवं-जौ/गेहूं-और-जौ","domain":"कृषि","language":"हिन्दी","id":410641,"title":"गेहूं और जौ ","summery":"इस भाग में दिसंबर माह में गेहूँ एवं जाै की खेती की देखभाल की जानकारी दी गई है। ","url":"https://agriculture.vikaspedia.in/viewcontent/agriculture/crop-production/91593f93893e92894b902-915947-93293f90f-92e94c93892e-90692793e93093f924-91594393793f-93893293e939/92e93e93993593e930-91594393793f-91593e93094d92f/दिसंबर-माह-के-कृषि-कार्य/गेहूं-एवं-जौ/गेहूं-और-जौ?lgn=hi"}],"content":"\u003cdiv id=\"MiddleColumn_internal\"\u003e\n\u003ch3 style=\"text-align: justify;\"\u003eभूमि का चयन और तैयार करना\u003c/h3\u003e\n\u003cp\u003eगेहूं की खेती विभिन्न प्रकार की भूमि में की जा सकती है। इसके लिए 6.5-7.8 पीएच रेंज और 1 प्रतिशत से अधिक जैविक\u003cimg class=\"image-right\" style=\"float: right;\" src=\"https://static.vikaspedia.in/media/images_hi/agriculture/crop-production/91c94893593f915-916947924940/wheatorganic.jpg\" width=\"435\" height=\"266\" /\u003eकार्बन युक्त सुनिकासी व्यवस्था वाली मध्यम दोमट और चिकनी दोमट मृदा उपयुक्त होती है। खेत में पीएच स्तर, जैविक कार्बन, सूक्ष्म पोषक तत्वों (एनपी.के.) और सूक्ष्मजीवों की संख्या की जांच करने के लिए वर्ष में एक बार मृदा की जांच करने की अपेक्षा होती है। यदि जैविक कार्बन का मात्रा 1 प्रतिशत से कम हो तो, 25-30 टन/हैक्टेयर कार्बनिक खाद का प्रयोग करें और खाद को भली भांति मिलाने के लिए खेत की 2-3 बार अच्छी तरह जुताई करें। प्रमाणि जैविक खेतों पर प्रतिबंधित सामग्रियों के प्रवाह को रोकने के लिए प्रमाणित जैविक खेतों और अजैविक खेतों के बीच लगभग 5-7 मीटर की दूरी पर पर्याप्त सुरक्षा पट्टी का प्रबन्ध किया जाए। गेहूं की खेती के लिए भली भांति सूक्ष्म जुताई किंतू छोटी बीज क्यारियां अपेक्षित होती हैं। खरीफ की कटाई के बाद, भूमि की जुताई की जाती है और पाटा अथवा किसी अन्य उपयुक्त जुताई यन्त्र द्वारा मिट्टी के बड़े पिण्डों को तोड़कर एकसमान सिंचाई के लिए खेत को भली भांति समतल बनाया जाता है। हल्के ढाल होने की स्थिति में, परिरेखा खेती विधि का आश्रय लेना चाहिए। हिमाचल प्रदेश में गेहूं की औसतन उपज 15.33 क्विंटल/हैक्टेयर है, जबकि राष्ट्रीय औसत 28. 02 क्विंटल/हैक्टेयर है। गेहूं की कम पैदावार के मुख्य कारण इसकी खेती 83 प्रतिशत बारानी भूमि पर की जा रही है, सुधरी किस्मों की कम भूमि पर खेती, खादों का कम प्रयोग, खरपतवार एवं कीट व बीमारियों का प्रकोप इत्यादि गेहूं की कम उपज का कारण है।\u003c/p\u003e\n\u003ch3 style=\"text-align: justify;\"\u003eबिजाई का समय\u003c/h3\u003e\n\u003cp style=\"text-align: justify;\"\u003eअच्छी पैदावार लेने के लिए गेहूं की बिजाई सही समय पर करनी चाहिए। प्रदेश के विभिन्न क्षेत्रों में बिजाई का समय निम्नलिखित है \u0026ndash;\u003c/p\u003e\n\u003ctable class=\"grid listing\" style=\"text-align: justify;\"\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eक्षेत्र\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eसिंचित\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eअसिंचित\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd colspan=\"3\"\u003e\n\u003cp\u003e\u003cstrong\u003eसमय से बिजाई \u003c/strong\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eनिचले पर्वतीय क्षेत्र\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eअक्तूबर के अंतिम सप्ताह - 15 नवम्बर\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eअक्तूबर के अंतिम सप्ताह15 नवम्बर\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eमध्यवर्ती पर्वतीय क्षेत्र\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003e- यथोपरि -\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003e- यथोपरि -\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eऊंचे पर्वतीय क्षेत्र\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003e1 अक्तूबर से 15 अक्तूबर\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003e1 अक्तूबर से 15 अक्तूबर\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd colspan=\"3\"\u003e\n\u003cp\u003eपछेती बिजाई\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eनिचले पर्वतीय क्षेत्र\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eदिसम्बर के अन्त तक\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eवर्षा पर निर्धारित परंतु दिसंबर के अंत तक\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eमध्यवर्ती पर्वतीय क्षेत्र\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003e- यथोपरि-\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003e- यथोपरि -\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eऊंचे पर्वतीय क्षेत्र\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003e15 अक्तूबर तक\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003e15 अक्तूबर तक\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp style=\"text-align: justify;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"text-align: justify;\"\u003eयदि देरी से बिजाई की जाये तो उत्पादन में कमी आ जाती है।\u003c/p\u003e\n\u003ch3 style=\"text-align: justify;\"\u003eआकस्मिक प्रणाली\u003c/h3\u003e\n\u003cp style=\"text-align: justify;\"\u003eयदि कुल्लू घाटी (खण्ड -2) में सर्दियों की बारिश आने में बहुत देरी हो जाये तो गेहूं (VL-892) और गोभी- सरसों (किस्म शीतल) की बिजाई सबसे लाभदायक रहती है। उसके बाद गेहूं (HS-490) की बिजाई जनवरी के पहले पखवाड़े तक कर लेनी चाहिए\u003c/p\u003e\n\u003cp style=\"text-align: justify;\"\u003eऔर ऐसी स्थिति में बारानी खेती के लिए दी गई नाईट्रोजन की मात्रा की 25 प्रतिशत अधिक मात्रा इन फसलों को देनी चाहिए। ऐसी परिस्थितियों में मसर (किस्म विपाशा), सरसों (किस्म बी.एस.एच.-1) या राया (किस्म वरूणा) को क्रमशः लगाना चाहिए।\u003c/p\u003e\n\u003ch3 style=\"text-align: justify;\"\u003eअनुमोदित किस्में\u003c/h3\u003e\n\u003ctable class=\"grid listing\" style=\"text-align: justify;\"\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eबिजाई\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eबिजाई का समय\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eअनुमोदित किस्में\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eअगेती\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eअक्तूबर 15 तक\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eवी.एल.- 829\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eसमय पर\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eअक्तूबर तीसरे सप्ताह से 15 नवम्बर तक\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eएच.पी.डब्ल्यू.-147\u003c/p\u003e\n\u003cp\u003eएच.पी.डब्ल्यू.-155\u003c/p\u003e\n\u003cp\u003eएच.पी.डब्ल्यू.- 249\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eपछेती\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eदिसम्बर अंत तक\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eएच.पी.डब्ल्यू.- 42\u003c/p\u003e\n\u003cp\u003eवी.एल.- 892\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp style=\"text-align: justify;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"text-align: justify;\"\u003eबीज का उपचार\u003c/h3\u003e\n\u003cp style=\"text-align: justify;\"\u003eबीज के उपचार से पूर्व, सुनिश्चित कर लें कि बीज स्वस्थ, आकार में एकसमान और किसी किस्म की कीट क्षति अथवा रोग से मुक्त हों। बीजों को प्रत्येक 10 कि.ग्रा. बीज के लिए पहले बीजामृत और ट्रिकोडर्मा विरदी से क्रमशः 1.5 कि.ग्रा. और 80 ग्राम की दर से संसाधित किया जाता है। फिर से 10 कि.ग्रा. बीजों के लिए प्रत्येक 200 ग्राम एजोटोबैक्टर और पीएसबी जैव उर्वरक के मिश्रण से बीजों को संसाधित करें। बीजों को छाया में सुखाएं और संसाधित करने के 6-8 घण्टे में बुआई करें।\u003c/p\u003e\n\u003ch3 style=\"text-align: justify;\"\u003eबीज दर और अंतराल\u003c/h3\u003e\n\u003cp style=\"text-align: justify;\"\u003eकिसान प्रायः छट्टा देकर बीज बोते हैं परंतु इसमें निराई, गुड़ाई में कठिनाई आती है। और पैदावार भ्ज्ञी कम होती है। इसलिए गेहू को 22 सें.मी. कतारों में बोया जाना चाहिए। सही समय की बिजाई के लिए 90-110 किलोग्राम बीज प्रति हैक्टेयर पर्याप्त होता है। लेकिन बारानी क्षेत्रों में 20 दिसम्बर के बाद बिजाई के लिए 150 किलोग्राम बीज प्रति हैक्टेयर उपयुक्त होता है। बीजों की बुआई 5-7.5 सें.मी. की गहराई पर, अभिमानतः ड्रिलिंग द्वारा अथवा हल के पीछे से की जाती है। सिंचाई की स्थितियों और बुआई के समय के आधार पर बीज की मात्रा और अंतराल भिन्न होता है जो निम्नानुसार है \u0026ndash;\u003c/p\u003e\n\u003cp style=\"text-align: justify;\"\u003eवर्षापोषित - अक्तूबर के मध्य से अक्तूबर के अंत तक बुआई, 75-90 कि.ग्रा./है0\u003c/p\u003e\n\u003cp style=\"text-align: justify;\"\u003eसिंचित-15 नवम्बर से 05 दिसम्बर के दौरान बुआई, 90 कि.ग्रा./है0|\u003c/p\u003e\n\u003cp style=\"text-align: justify;\"\u003eविलम्बित सिंचित-5 दिसम्बर से दिसंबर के अंत तक की अवधि के दौरान बुआई, 130-150 कि.ग्रा./है0\u003c/p\u003e\n\u003cp style=\"text-align: justify;\"\u003eवर्षापोषित और सिंचित स्थितियों में पंक्ति दर पंक्ति दूरी 22.5 सें.मी. बनाए रखनी चाहिए। विलंबित बुआई के मामले में, पंक्ति दर पंक्ति से 15-18 सें.मी. तक कम कर देनी चाहिए। वर्षापोषित स्थितियों में कुछ किसान केवल 50-75 कि.ग्रा. गेहूं के बीजों की बुआई छितराकर करते हैं। पौधों की कम संख्या और आंतर अंतराल में बढ़ौतरी से टिलरस अधिक संख्या में होते हैं और उत्पादकता भी अधिक होती है। जैव विविधता बनाए रखने के लिए, बुआई के समय गेहूं के बीजों के साथ 3 कि.ग्रा. मसर | और 500 ग्राम सरसों के बीज मिलाए जा सकते हैं। गेहूं की प्रत्येक 8-12 पंक्तियों के बाद उभार लिए मेंढों पर एक पंक्ति राजमाह की बुआई की जा सकती है और गेहूं की प्रत्येक पंक्ति में कहीं-कहीं सरसों की बुआई की जा सकती है।\u003c/p\u003e\n\u003ch3 style=\"text-align: justify;\"\u003eमृदा उर्वरकता प्रबंधन\u003c/h3\u003e\n\u003cp style=\"text-align: justify;\"\u003eजैविक खेती में रासायनिक खादों का प्रयोग नहीं किया जाता। अतः 15 टन देसी खाद + 2 टन बी.डी. कम्पोस्टर प्रति हैक्टेयर या केंचुआ खाद 10 टन + बी.डी. कम्पोस्ट 2 टन प्रति हैक्टेयर उपयुक्त होती है। गेहूं से पूर्व फसल (खरीफ में) प्रति एकड़ को पर्याप्त उर्वरक (1-2 टन कपोस्ट), 100 कि.ग्रा. रॉक - फॉस्फेट और 2 कि.ग्रा. पीएसबी दिया जाना चाहिए। खरीफ की फसल के बाद, फसल के अवशेषों को एकत्र कर ढेर के रूप में मेढ़ों पर रख दें। अवशेष के ढेर को गाय के गोबर - गौमूत्र के घोल (50 लीटर/टन) और ट्रिकोडर्मा विरदी (1 कि.ग्रा. प्रति टन) सस्य से भिगो दें। बुआई के समय 2.0 कि.ग्रा. पीएसबी के साथ 8-10 क्विंटल एफवाईएम/कपोस्ट अथवा 5-10 कि.ग्रा. चूना भी मिलाया जाना चाहिए। 200-300 कि.ग्रा. सांद्रित उर्वरक (शुष्क मुर्गी उर्वरक और खली का चूरा 1:1 अथवा कोई अन्य किस्म) और ड्रिलिंग से 150-200 कि.ग्रा. नीम/पोंगम/अरंडी/मूंगफली केक से उत्पादकता में बढ़ौतरी होगी। फॉस्फोरस की उपलब्धता में बढ़ौतरी के लिए अंडे के छिलके का उर्वरक अथवा बायोडाइनेमिक्स कपोस्ट भी प्रयोग किया जा सकता है। सूक्ष्मजीवों की शीघ्र बढ़ौतरी और विभिन्न पोषक तत्वों के शीघ्र मोचन के लिए संजीवक अथवा अमृतपानी अथवा जीवामृत का समय पर प्रयोग आवश्यक है। इन तीनों में से, जीवामृत सबसे अधिक प्रभावी है। बुआई के बाद पहली चार सिंचाईयों के दौरान यथा: 21, 42, 60 और 75 दिनों के बाद 500 लीटर जीवमृत प्रति हैक्टेयर प्रयोग की जाती है। फसल की उचित वृद्धि के लिए 20 दिनों के बाद 7-10 दिनों के अंतराल पर दानों के निर्माण की अवस्था तक पत्ते पर छिड़काव के तौर पर वर्मीवश और गौमूत्र का प्रयोग किया जाए। एक एकड़ क्षेत्र में छिड़काव के लिए लगभग 200 लीटर पानी में 20 लीटर गौमूत्र मिलाएं। पानी की उपलब्धता के आधार पर गेहूं की अच्छी उपज लेने के लिए निम्नलिखित सिंचाई की व्यवस्था करनी चाहिए।\u003c/p\u003e\n\u003ch3 style=\"text-align: justify;\"\u003eसिंचाई और पानी\u003c/h3\u003e\n\u003ctable class=\"vertical listing\" style=\"text-align: justify;\"\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd colspan=\"3\"\u003e\n\u003cp\u003eगेहूं की फसल में जो संभव सिंचाईयां दी जा सकें\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd colspan=\"3\"\u003e\n\u003cp\u003eफसल की बढ़ौतरी की विभिन्न अवस्थाएं जब सिंचाई देनी चाहिए।\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eसिंचाई\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eमूसल जड़े निकलने पर\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eदौजियां निकलने की अंतिम अवस्था पर\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eगांठ बनने अंतिम की अवस्था पर\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eफूल आने की अंतिम अवस्था पर\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eदानों में दूध पड़ने पर\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eएक\u003c/p\u003e\n\u003cp\u003eदो\u003c/p\u003e\n\u003cp\u003eतीन\u003c/p\u003e\n\u003cp\u003eचार\u003c/p\u003e\n\u003cp\u003eपांच\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eसिंचाई दें\u003c/p\u003e\n\u003cp\u003eसिंचाई दें\u003c/p\u003e\n\u003cp\u003eसिंचाई दें\u003c/p\u003e\n\u003cp\u003eसिंचाई दें\u003c/p\u003e\n\u003cp\u003eसिंचाई दें\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eसिंचाई दें\u003c/p\u003e\n\u003cp\u003eसिंचाई दें\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eसिंचाई दें\u003c/p\u003e\n\u003cp\u003eसिंचाई दें\u003c/p\u003e\n\u003cp\u003eसिंचाई दें\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eसिंचाई दें\u003c/p\u003e\n\u003cp\u003eसिंचाई दें\u003c/p\u003e\n\u003cp\u003eसिंचाई दें\u003c/p\u003e\n\u003cp\u003eसिंचाई दें\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eसिंचाई दें\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp style=\"text-align: justify;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"text-align: justify;\"\u003eयदि सिंचाई की और व्यवस्था हो, तो बिजाई से पहले सिंचाई करनी चाहिए या बिजाई के 30-40 दिनों के बाद सिंचाई देनी चाहिए।\u003c/p\u003e\n\u003ch3 style=\"text-align: justify;\"\u003eसस्य विधियां और खरपतवार प्रबंधन\u003c/h3\u003e\n\u003cp style=\"text-align: justify;\"\u003eमल्चिंग और सतह प्रबंधन- बुआई से 24 - 48 घंटों के बाद ढाल के अनुसार खेतों को छोटी मेंढे बनाकर छोटी क्यारियों में विभाजित कर दें। मल्च का कार्य करने के लिए खरीफ की फसल के आंशिक तौर पर विघटित फसल अवशेष (मेंद्रों पर पड़े हुए) को पूरे खेत पर फैला दें।\u003c/p\u003e\n\u003cp style=\"text-align: justify;\"\u003eनिराई- सिंचित दशा में, न्यूनतम 3 बार निराई आवश्यक है, प्रथम 20-25 दिनों, द्वितीय 40-45 दिनों और तृतीय 60-65 दिनों के अंतराल पर। वर्षापोषित परिस्थितियों में दो बार निराई जरूरी होती है। जैविक प्रबंधन के तहत हाथ से निराई सबसे अधिक प्राथमिकता वाली विधि है।\u003c/p\u003e\n\u003ch3 style=\"text-align: justify;\"\u003eअतिरिक्त फसल प्रणाली\u003c/h3\u003e\n\u003cp style=\"text-align: justify;\"\u003eगेहूं को प्रायः मक्की/धान की फसल प्रणाली के साथ लगाया जाता है। परंतु सिंचित अवस्थाओं में धान-मूली-आलू, मक्की-मूली-प्याज, मक्की-तोरिया-आलू और मक्की-तोरिया + गोभी सरसों फसल चक्र अधिक आय देने वाले हैं। असिंचित अवस्थाओं में मक्की-तोरिया + गोभी सरसों, मक्की-चना और मक्की+रौंगी-गेहूं फसल प्रणालियां, मक्की-गेहूं फसल चक्र से अधिक लाभदायक हैं। खंड-1 के असिंचित क्षेत्रों में अरहर (सरिता) - गेहूं (वी.एल.- 892/एनएस.-490) फसल चक्र मक्की -गेहूं फसल चक्र अधिक लाभदायक है।\u003c/p\u003e\n\u003ch3 style=\"text-align: justify;\"\u003eफसल की सुरक्षा\u003c/h3\u003e\n\u003cp style=\"text-align: justify;\"\u003eकीट प्रबंधन\u003c/p\u003e\n\u003ctable class=\"grid listing\" style=\"text-align: justify;\"\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eदीमक व टीडे मकौड़े\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eदीमक फसल की वृद्धि की किसी भी अवस्था में फसल को क्षति पहुंचा सकती है। यह समस्या सिंचित क्षेत्रों की अपेक्षा वर्षापोषित क्षेत्रों में अधिक प्रमुख है। गैर - सिंचित दशाओं में अविघटित कार्बनिक खाद के प्रयोग से भी दीमक के प्रकोप की संभावना बढ़ सकती है। बुआई के समय मृदा में नीम के पत्ते की खाद (5 क्विंटल/है0) अथवा नीम खाद (1 क्विंटल/है0) के प्रयोग से दीमक के आक्रमण से बचा जा सकता है। चूना और गंधक का मिश्रण जमीन में डालने से दीमक के प्रकोप में कमी आती है। लकड़ी की राख को पौधों के तनों के मूल में डालने से भी दीमक के प्रकोप में कमी आती है। पशु - मूत्र को पानी में 1:6 में मिलाकर बार - बार दीमक के घरों में डालने से उनके प्रसार को रोका जा सकता है। वीवेरिया या मेटाराईजियम फफूद का कण अवस्था में (6 ग्राम प्रति वर्ग मीटर) प्रयोग करें।\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eआर्मी वॉर्मस\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eइस कीट की इल्ली पौधे विशेषकर उसके नाजुक अंगों को रात्रि के दौरान खाती है और दिन के समय छिपी रहती है। वे पत्तों और बालियों को भी क्षति पहुंचाती है। नीम के पत्तों के सत्व (उबले हुए पानी में 5 कि.ग्रा. टुकड़े-टुकड़े नीम के पत्ते और 100 लीटर पानी में विघटित) से इसके आक्रमण को प्रभावी तौर पर कम किया जा सकता है। संडियों को इकट्ठा करके नष्ट कर दें। एन.पी.वी., वी.टी. का प्रयोग करें। या दशपर्णी का 10 प्रतिशत घोल का प्रयोग करें।\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eबाउन व्हीट इल्ली, एफिड्स और जैस्सिड्स\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eगेहूं के साथ सरसों और कुसुम (बुआई के समय प्रत्येक 100 कि.ग्रा. गेहूं के साथ मिश्रित 100 ग्राम बीज) का आंतर फसल से भी कुटकी के फैलाव को प्रभावी तौर पर नियंत्रित किया जा सकता है। गंभीर आक्रमण की स्थिति में, 3-5 दिन तक 100 लीटर पानी में 15 लीटर गौमूत्र, 2 कि.ग्रा. गाय के गोबर और 15 कि.ग्रा. टुकड़े-टुकड़े किए नीम के पत्तों का प्रयोग करें। खमीर को छानें और एक एकड़ में पत्तों पर छिड़काव के लिए प्रयोग करें। यह पालतू जानवरों के प्राकृतिक शत्रुओं जैसे सुररखी आदि के लिए सुरक्षित है।\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3 style=\"text-align: justify;\"\u003eरोग प्रबंधन\u003c/h3\u003e\n\u003ctable class=\"grid listing\" style=\"text-align: justify;\"\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eरतुआ\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eरतुआ फफूदी, रोग की तीन भिन्न प्रजातियों की वजह से होता है। भूरा और पीला रतुआ उत्तरी - पश्चिमी भाषा में विशेष महत्व रखते हैं। इन क्षेत्रों में काला रतुआ काफी विलम्ब से दिखाई देता है और सामान्यतः काफी विलंब से बुआई वाले खेतों को छोड़ अधिक क्षति नहीं पहुंचाते। तथापि, मध्य और पूर्वी भारत में काला रतुआ भयंकर रूप में प्रकट होता है और काफी अधिक नुकसान पहुंचाता है। रतुओं को नियंत्रित करने हेतु सर्वाधिक प्रभावी विधि रतुआ - प्रतिरोधी किस्में उगाना है। गेहूं की किस्मों के बीच जैव विविधता से भी रतुआ की समस्या को प्रभावी तौर पर नियंत्रित किया जा सकता है। प्रत्येक फार्म पर एक समय में गेहूं की 3-4 किस्मों का प्रयोग करें। विलम्ब से बुआई अथवा देरी से परिपक्व होने वाली किस्मों से बचा जाए। फसल को रतुआ के संक्रमण से बचाने के लिए 200 लीटर पानी के सज्ञथ 5 लीटर खट्टी छाछ का छिड़काव करें। रतुआ के संक्रमण से बचने के लिए (चौलाई अथवा लाल भाजी - एक आम हरी पत्तेदार सब्जी) अथवा मैंथा (पुदीना) के पत्तों के चूर्ण को भी महीन छिड़काव (प्रति लीटर पानी 25-30 ग्राम सूखे पत्तों का पाउडर) के तौर पर प्रयोग किया जा सकता है। रतुआ संक्रमण रोकने के लिए हिबिस्कस रोसा-चानेन्सीस (चीनी गुलाब) के सूखे पत्तों का सार भी पत्तों पर छिड़काव के तौर पर प्रयोग किया जा सकता है।\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eखुला काला चुर्णिल रोग\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eसभी किस्मों में बाहरी लक्षण रोगग्रस्त पौधे की लगभग प्रत्येक बाल में गेहूं के दानों खाद्यान्न के स्थान पर काले चूर्ण का बनना है। जैविक खेती के तहत प्रतिरोधी किस्मों का प्रयोग सर्वश्रेष्ठ विकल्प है। इसके अतिरिक्त, चूंकि यह रोग बीजजन्य है, रोगमुक्त बीज के प्रयोग से इसे होने से रोका जा सकता है। शंका की स्थिति में, बीज को 5 प्रतिशत वर्मीवाश से संसाधिक करें। संक्रमित पौधों को उखाड़ दें और उनके बीजाणुओं के छितरने से पहले उन्हें जला दें। झुलसाने वाली गर्मी वाले क्षेत्रों में बीजों के धूप के ताप में संसाधन से भी इसके रोगवाहक को काफी हद तक समाप्त किया जा सकता है।\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\n\u003cp\u003eबंटुआ\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd\u003e\n\u003cp\u003eउत्तरी भारत में गेहूं की सभी व्यावसायिक किस्मों में करनाल बंटुआ की समस्या आम है। किन्तु यह रोग पारंपरिक किस्मों में काफी दुर्लभ है। इस रोग से गेहूं के गुणवत्ता और परिमाण, दोनों में कमी आती है। खाद्यान्न का एक अंश, इसकी लीक के साथ-साथ काले चूर्ण सामग्री में परिवर्तित हो जाता है, जिसमें से बदबू आती है। प्रतिरोधी किस्में उगाना विकल्प है। रोगमुक्त बीजों का प्रयोग करें। बीजों को 5 प्रतिशत वर्मीवॉश से पूर्व संसाधित करें। 100 लीटर जल में 1 कि.ग्रा. सरसों के आटे और 5 लीटर दूध के मिश्रण का पत्तों पर छिड़काव के तौर पर प्रतिशत नमी की संस्तुति की जाती है। प्राकृतिक अथवा यांत्रिक स्रोतों से इसे सूखाया जाता है। 30 से 40 डिग्री से0 तापमान पर 13 प्रतिशत से अधिक नमी होने पर गेहूं में फफूदी लग सकती है जिसके कारण इसमें फफूदीदार दुर्गंध, बदरंगपन और निम्न आटा का उत्पादन होता है। गेहूं के लिए संतुलित नमी मात्रा 70 प्रतिशत सापेक्षिक आर्द्रता पर 13.5 प्रतिशत है। अल्पकाल के लिए, भण्डारण में 13 से 14 प्रतिशत नमी की मात्रा सह्य है जबकि 5 वर्ष तक की लंबी अवधि तक के लिए यह 11 से 12 प्रतिशत होनी चाहिए। इसे भृग से बचाने के लिए 0.5 प्रतिशत का तेज काली मिर्च पाउडर मिश्रित करें। गाय का गोबर अथवा 2 प्रतिशत नीम पाउडर भंडारित गेहूं को सूंडी और अन्य पीड़कों से बचाते हैं।\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3 style=\"text-align: justify;\"\u003eउपज\u003c/h3\u003e\n\u003cp style=\"text-align: justify;\"\u003eजैविक तौर पर उगाए गेहूं की औसत उत्पादकता 40-50 क्विंटल/है0 के बीच होती हैं।\u003c/p\u003e\nस्रोत: \u003ca class=\"external_link ext-link-icon external-link\" title=\" इंटरनेशनल कॉम्पीटेंस सेंटर फॉर आर्गेनिक एग्रीकल्चर  (नए विंडोज में खुलने वाली अन्य वेबसाइट लिंक)\" href=\"http://www.iccoa.org/\" target=\"_blank\" rel=\"noopener\"\u003e इंटरनेशनल कॉम्पीटेंस सेंटर फॉर आर्गेनिक एग्रीकल्चर \u003c/a\u003e\u003c/div\u003e","lgn":"hi","depth":4,"updated_at":"2020-04-14T22:27:29.000+00:00","subHeading":"\u003col\u003e\u003cli\u003e\u003ca href='#section1' \u003eभूमि का चयन और तैयार करना\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href='#section2' \u003eबिजाई का समय\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href='#section3' \u003eआकस्मिक प्रणाली\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href='#section4' \u003eअनुमोदित किस्में\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href='#section5' \u003eबीज का उपचार\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href='#section6' \u003eबीज दर और अंतराल\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href='#section7' \u003eमृदा उर्वरकता प्रबंधन\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href='#section8' \u003eसिंचाई और पानी\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href='#section9' \u003eसस्य विधियां और खरपतवार प्रबंधन\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href='#section10' \u003eअतिरिक्त फसल प्रणाली\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href='#section11' \u003eफसल की सुरक्षा\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href='#section12' \u003eरोग प्रबंधन\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href='#section13' \u003eउपज\u003c/a\u003e\u003c/li\u003e"
